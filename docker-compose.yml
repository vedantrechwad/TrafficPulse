services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: trafficpulse-backend:latest
    container_name: trafficpulse-backend
    ports:
      - "8000:8000"
    environment:
      - SPARK_DRIVER_MEMORY=2g
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: trafficpulse-frontend:latest
    container_name: trafficpulse-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
